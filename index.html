    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ff0f5b; --gold: #ffd700; --dark: #050505; --panel: #111; }
        body { background: var(--dark); color: #eee; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* NAV */
        nav { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); border-bottom: 1px solid #333; z-index: 100; padding: 10px 0; display:flex; justify-content:center; gap:20px; }
        .nav-item { cursor: pointer; font-size: 0.8rem; font-weight: bold; color: #888; text-transform: uppercase; }
        .nav-item.active { color: var(--primary); }
        
        /* CONTAINER */
        .container { max-width: 600px; margin: 80px auto 20px; padding: 15px; display: none; }
        .container.active { display: block; }
        
        /* ELEMENTS */
        .logo { text-align: center; font-family: 'Cinzel', serif; font-size: 2.5rem; color: #fff; text-shadow: 0 0 10px var(--primary); margin-top: 20px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-gold { background: var(--gold); color: black; }
        
        /* CHAT */
        #chat-widget { position: fixed; bottom: 0; left: 0; right: 0; height: 50vh; background: #000; border-top: 2px solid var(--primary); z-index: 200; display: none; flex-direction: column; }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; max-width: 85%; }
        .msg.bot { background: #222; align-self: flex-start; border-left: 2px solid var(--primary); color: #ccc; }
        .msg.user { background: var(--primary); align-self: flex-end; color: #fff; }
        .chat-ctrl { padding: 10px; background: #111; display: flex; gap: 5px; }
        input.field { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; }
        
        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 500; }
        .modal-box { background: #111; padding: 20px; border: 1px solid var(--gold); width: 90%; max-width: 350px; text-align: center; }

        /* INCOMING CALL */
        #call-overlay { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #111; border: 2px solid var(--primary); padding: 15px; z-index: 400; text-align: center; border-radius: 10px; width: 280px; box-shadow: 0 0 20px #ff0f5b; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-item active" onclick="showTab('home')">Home</div>
        <div class="nav-item" onclick="showTab('vip')">VIP</div>
        <div class="nav-item" onclick="toggleChat()">Chat</div>
    </nav>

    <div class="logo" onclick="openAdmin()">JOI.AI</div>

    <!-- HOME TAB -->
    <div id="home" class="container active">
        <!-- VIDEO -->
        <div style="border: 1px solid #333; margin-bottom: 20px;">
            <div style="background:red; color:white; padding:5px; font-size:0.7rem; font-weight:bold;">● LIVE NOW</div>
            <video controls autoplay muted loop playsinline width="100%">
                <source src="1.mp4" type="video/mp4">
            </video>
        </div>

        <!-- AFFILIATE BANNER (Safe) -->
        <div style="text-align:center; margin-bottom:20px;">
             <a href="https://t.crjmpy.com/396104/9403/0?target=overlay&file_id=613421&aff_sub5=SF_006OG000004lmDN&aff_sub4=AT_0002" target="_blank">
                <img src="https://www.imglnkx.com/9403/ADV-21652_DESIGN-21652_300250.jpg" style="max-width:100%; border:2px solid var(--gold); border-radius:10px;">
            </a>
        </div>
        
        <button class="btn btn-gold" onclick="openPay('Full Access')">ENTER VIP LOUNGE ($20)</button>
    </div>

    <!-- VIP TAB -->
    <div id="vip" class="container">
        <h2 style="text-align:center; color:var(--gold)">VIP CONTENT</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div style="background:#222; height:150px; display:flex; align-items:center; justify-content:center; border:1px solid #444; cursor:pointer;" onclick="openPay('Photo Set 1')">🔒 LOCKED</div>
            <div style="background:#222; height:150px; display:flex; align-items:center; justify-content:center; border:1px solid #444; cursor:pointer;" onclick="openPay('Photo Set 2')">🔒 LOCKED</div>
            <div style="background:#222; height:150px; display:flex; align-items:center; justify-content:center; border:1px solid #444; cursor:pointer;" onclick="openPay('Video 1')">🔒 LOCKED</div>
            <div style="background:#222; height:150px; display:flex; align-items:center; justify-content:center; border:1px solid #444; cursor:pointer;" onclick="openPay('Video 2')">🔒 LOCKED</div>
        </div>
    </div>

    <!-- CHAT WIDGET -->
    <div id="chat-widget">
        <div style="padding:10px; background:#111; border-bottom:1px solid #333; display:flex; justify-content:space-between;">
            <span style="color:var(--primary); font-weight:bold;">MISTRESS VIPER</span>
            <span onclick="toggleChat()" style="cursor:pointer">✕</span>
        </div>
        <div id="chat-msgs">
            <div class="msg bot">I'm waiting. Type something or pay up.</div>
        </div>
        <div class="chat-ctrl">
            <input type="text" id="chat-in" class="field" placeholder="Type here..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" class="btn" style="width:auto; margin-top:0;">➤</button>
        </div>
    </div>

    <!-- INCOMING CALL POPUP -->
    <div id="call-overlay">
        <h3>Incoming Call...</h3>
        <p>Mistress Viper</p>
        <button class="btn" style="background:#0b0;" onclick="window.open('https://t.crjmpy.com/396104/9403/0?target=overlay&file_id=613421&aff_sub5=SF_006OG000004lmDN&aff_sub4=AT_0002')">ANSWER VIDEO</button>
        <button class="btn" style="background:#b00; margin-top:5px;" onclick="document.getElementById('call-overlay').style.display='none'">IGNORE</button>
    </div>

    <!-- PAYMENT MODAL -->
    <div id="pay-modal" class="modal">
        <div class="modal-box">
            <h2 style="color:var(--gold)">LOCKED</h2>
            <p>Send <strong>$20</strong> to unlock.</p>
            <div style="background:#000; padding:10px; text-align:left; font-size:0.9rem; margin-bottom:10px;">
                <strong>CashApp:</strong> <span id="d-cash">...</span><br>
                <strong>BTC:</strong> <span id="d-btc">...</span>
            </div>
            <button class="btn" onclick="document.getElementById('pay-modal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="modal">
        <div class="modal-box">
            <h3>ADMIN SETUP</h3>
            <input id="k-brain" class="field" type="password" placeholder="OpenRouter API Key">
            <input id="k-voice" class="field" type="password" placeholder="ElevenLabs API Key" style="margin-top:5px;">
            <input id="s-cash" class="field" type="text" placeholder="$CashAppTag" style="margin-top:5px;">
            <input id="s-btc" class="field" type="text" placeholder="BTC Address" style="margin-top:5px;">
            <button class="btn" onclick="saveAdmin()">SAVE SETTINGS</button>
        </div>
    </div>

    <script>
        const VOICE_ID = "hA4zGnmTwX2NQiTRMt7o";
        let clicks = 0;
        
        function showTab(id) {
            document.querySelectorAll('.container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function toggleChat() {
            const c = document.getElementById('chat-widget');
            c.style.display = (c.style.display === 'flex') ? 'none' : 'flex';
        }

        function openAdmin() {
            clicks++;
            if(clicks === 3) {
                document.getElementById('k-brain').value = localStorage.getItem('v_brain')||'';
                document.getElementById('k-voice').value = localStorage.getItem('v_voice')||'';
                document.getElementById('s-cash').value = localStorage.getItem('v_cash')||'';
                document.getElementById('s-btc').value = localStorage.getItem('v_btc')||'';
                document.getElementById('admin-modal').style.display = 'flex';
                clicks = 0;
            }
        }

        function saveAdmin() {
            localStorage.setItem('v_brain', document.getElementById('k-brain').value);
            localStorage.setItem('v_voice', document.getElementById('k-voice').value);
            localStorage.setItem('v_cash', document.getElementById('s-cash').value);
            localStorage.setItem('v_btc', document.getElementById('s-btc').value);
            document.getElementById('admin-modal').style.display = 'none';
            alert('Settings Saved');
        }

        function openPay(item) {
            document.getElementById('d-cash').innerText = localStorage.getItem('v_cash') || "Not Set";
            document.getElementById('d-btc').innerText = localStorage.getItem('v_btc') || "Not Set";
            document.getElementById('pay-modal').style.display = 'flex';
        }

        // Show fake call after 8 seconds
        setTimeout(() => { document.getElementById('call-overlay').style.display = 'block'; }, 8000);

        async function sendMsg() {
            const inp = document.getElementById('chat-in');
            const txt = inp.value.trim();
            if(!txt) return;

            const b = document.getElementById('chat-msgs');
            b.innerHTML += `<div class="msg user">${txt}</div>`;
            inp.value = '';
            
            const key = localStorage.getItem('v_brain');
            if(!key) { b.innerHTML += `<div class="msg bot">Admin needs to set API Key (Click Logo 3x).</div>`; return; }

            try {
                const req = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json", "HTTP-Referer": window.location.href },
                    body: JSON.stringify({ 
                        model: "gryphe/mythomax-l2-13b", 
                        messages: [{role:"system", content:"You are Mistress Viper. Dominant, rude, demanding."}, {role:"user", content:txt}] 
                    })
                });
                const d = await req.json();
                const aiTxt = d.choices[0].message.content;
                b.innerHTML += `<div class="msg bot">${aiTxt}</div>`;
                b.scrollTop = b.scrollHeight;

                const vKey = localStorage.getItem('v_voice');
                if(vKey) {
                    const vr = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                        method: "POST", headers: { "xi-api-key": vKey, "Content-Type": "application/json" },
                        body: JSON.stringify({ text: aiTxt, model_id: "eleven_multilingual_v2" })
                    });
                    if(vr.ok) new Audio(URL.createObjectURL(await vr.blob())).play();
                }
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
